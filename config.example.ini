[General]
Botname: ExampleBot
Host: 127.0.0.1
Port: 10022
ServerId: 1
DefaultChannel: Botchannel
User: serveradmin
Password: query-password
SSH: True
AcceptAllSSHKeys: True
SSHHostKeyFile: .ssh/ssh_hostkeys
SSHLoadSystemHostKeys: False
# Worker counts for regular events and private-message commands.
EventWorkers: 2
CommandWorkers: 1
# Maximum running plus queued observer jobs. Full queues apply backpressure.
EventQueueSize: 50
CommandQueueSize: 10
# Set this to the service's MemoryMax value (in MiB) to enable memory warnings.
# 0 disables warnings.
MemoryLimitMB: 128

[Plugins]
UtilCommand: utils
AfkMover: afk_mover.main
IdleMover: idle_mover.main

[afk_mover]
frequency: 2.0
channel: Away
